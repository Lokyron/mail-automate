<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox Agent</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header>
  <div class="titre">
    <h1>Inbox Agent</h1>
    <span id="phase" class="badge">…</span>
  </div>
  <div class="actions">
    <button id="relever" class="secondaire">Relever</button>
    <button id="rediger" class="secondaire">Rédiger les brouillons en attente</button>
    <button id="motdepasse" class="discret-btn">Mot de passe</button>
    <button id="deconnexion" class="discret-btn">Quitter</button>
  </div>
</header>

<!-- Invitation a changer le mot de passe pose a l'installation. Un bandeau,
     pas une barriere. -->
<div id="bandeau-mdp" class="bandeau" hidden>
  <span>Le mot de passe en service est celui posé à l'installation.</span>
  <button id="bandeau-changer" class="secondaire">Le changer</button>
  <button id="bandeau-plus-tard" class="discret-btn">Plus tard</button>
</div>

<section id="mesures" class="mesures"></section>

<nav class="onglets">
  <button data-vue="attente" class="actif">À juger</button>
  <button data-vue="tout">Tous les messages</button>
  <button data-vue="regles">Règles</button>
  <button data-vue="agent">Agent</button>
  <button data-vue="maj">Mises à jour</button>
</nav>

<main>
  <div id="vue-messages" class="colonnes">
    <ul id="liste" class="liste"></ul>
    <article id="detail" class="detail vide">
      <p class="discret">Choisis un message à gauche.</p>
    </article>
  </div>

  <div id="vue-agent" hidden>
    <div id="fil-agent" class="carte fil"></div>
    <form id="form-agent" class="ligne-form">
      <input name="question" placeholder="De quoi parlait le dernier mail de Lucie ? Reformule le brouillon en plus court…" autocomplete="off" required>
      <button type="submit">Demander</button>
      <button type="button" id="oublier" class="discret-btn">Oublier le fil</button>
    </form>
    <p class="discret">
      L'agent cherche, lit et réécrit. Il ne peut pas envoyer : il prépare, je confirme.
    </p>
  </div>

  <div id="vue-maj" hidden>
    <div id="carte-maj" class="carte"></div>
  </div>

  <div id="vue-regles" hidden>
    <form id="form-regle" class="carte ligne-form">
      <select name="champ">
        <option value="from_email">Expéditeur</option>
        <option value="subject">Objet</option>
        <option value="body_text">Corps</option>
        <option value="to_text">Destinataire</option>
        <option value="list_id">En-tête List-Id</option>
      </select>
      <select name="operateur">
        <option value="contient">contient</option>
        <option value="commence">commence par</option>
        <option value="finit">finit par</option>
        <option value="egal">est exactement</option>
        <option value="regex">correspond à (regex)</option>
        <option value="renseigne">est renseigné</option>
      </select>
      <input name="valeur" placeholder="valeur" required>
      <select name="label" id="labels-regle"></select>
      <select name="priorite">
        <option value="normale">normale</option>
        <option value="haute">haute</option>
        <option value="basse">basse</option>
      </select>
      <label class="case"><input type="checkbox" name="repondre"> à répondre</label>
      <button type="submit">Ajouter</button>
    </form>
    <table id="table-regles" class="table"></table>
  </div>
</main>

<!-- Panneau de changement de mot de passe. JAMAIS BLOQUANT : il s'ouvre depuis
     le bandeau ou depuis le bouton d'en-tete, et se referme toujours. Une
     version precedente occupait tout l'ecran tant qu'un drapeau du serveur
     n'etait pas retombe — et le moindre grain de sable (un cache, une saisie
     malheureuse) laissait l'utilisateur enferme dehors. Un bandeau ne peut
     enfermer personne. -->
<div id="ecran-mdp" class="ecran" hidden>
  <form id="form-mdp" class="carte connexion">
    <h2 id="titre-mdp">Changer le mot de passe</h2>
    <p id="motif-mdp" class="discret"></p>
    <label>Mot de passe actuel<input name="actuel" type="password" autocomplete="current-password" required></label>
    <label>Nouveau mot de passe<input name="nouveau" type="password" autocomplete="new-password" required></label>
    <label>Répéter<input name="repeter" type="password" autocomplete="new-password" required></label>
    <div class="rangee">
      <button type="submit">Enregistrer</button>
      <button type="button" id="annuler-mdp" class="discret-btn">Annuler</button>
    </div>
    <p id="erreur-mdp" class="erreur" hidden></p>
  </form>
</div>

<p id="toast" class="toast" hidden></p>
<script src="/js/app.js"></script>
</body>
</html>
